<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign Up | Aziz's Website</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f6f8;
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Navbar */
        .navbar {
            padding: 15px 0;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 22px;
        }

        /* Header */
        .signup-header {
            background: linear-gradient(135deg, #1d3557, #457b9d);
            color: white;
            padding: 70px 20px;
            text-align: center;
        }

        .signup-header h1 {
            font-weight: bold;
        }

        /* Signup section */
        .signup-section {
            padding: 60px 0;
        }

        .signup-box {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .signup-box h2 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .section-line {
            width: 60px;
            height: 3px;
            background-color: #457b9d;
            margin: 0 auto 30px auto;
        }

        .form-control {
            padding: 12px;
            height: auto;
        }

        /* Footer */
        footer {
            background-color: #212529;
            color: white;
            padding: 22px 0;
            text-align: center;
        }

        footer p {
            margin: 0;
        }
    </style>

</head>

<body>


<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand" href="storefront.html">
            Aziz's Website
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#about">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#images">
                        Images
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#contact">
                        Contact
                    </a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="signup.html">
                        Sign Up
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Header -->
<header class="signup-header">

    <div class="container">

        <h1 class="display-4">
            User Signup
        </h1>

        <p class="lead">
            Create your account below.
        </p>

    </div>

</header>


<!-- Main body -->
<main class="signup-section">

    <div class="container">

        <div class="signup-box">

            <div class="text-center">

                <h2>
                    User Signup
                </h2>

                <div class="section-line"></div>

            </div>


            <form>


                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username:
                    </label>

                    <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email:
                    </label>

                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email"
                            required>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password:
                    </label>

                    <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password:
                    </label>

                    <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            required>

                </div>


                <button
                        type="submit"
                        class="btn btn-primary btn-block">

                    Sign Up

                </button>


            </form>

        </div>

    </div>

</main>


<!-- Footer -->
<footer>

    <div class="container">

        <p>
            &copy; 2026 Aziz's Website | Created with Bootstrap
        </p>

    </div>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
