<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign Up | Aziz's Website</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f6f8;
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Navbar */
        .navbar {
            padding: 15px 0;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 22px;
        }

        /* Header */
        .signup-header {
            background: linear-gradient(135deg, #1d3557, #457b9d);
            color: white;
            padding: 70px 20px;
            text-align: center;
        }

        .signup-header h1 {
            font-weight: bold;
        }

        /* Signup section */
        .signup-section {
            padding: 60px 0;
        }

        .signup-box {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .signup-box h2 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .section-line {
            width: 60px;
            height: 3px;
            background-color: #457b9d;
            margin: 0 auto 30px auto;
        }

        .form-control {
            padding: 12px;
            height: auto;
        }

        /* Validation messages */
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }

        .success-message {
            color: green;
            font-size: 16px;
            margin-top: 15px;
            text-align: center;
        }

        /* Footer */
        footer {
            background-color: #212529;
            color: white;
            padding: 22px 0;
            text-align: center;
        }

        footer p {
            margin: 0;
        }
    </style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand" href="storefront.html">
            Aziz's Website
        </a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#about">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#images">
                        Images
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="storefront.html#contact">
                        Contact
                    </a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="signup.html">
                        Sign Up
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Header -->
<header class="signup-header">

    <div class="container">

        <h1 class="display-4">
            User Signup
        </h1>

        <p class="lead">
            Create your account below.
        </p>

    </div>

</header>


<!-- Main body -->
<main class="signup-section">

    <div class="container">

        <div class="signup-box">

            <div class="text-center">

                <h2>User Signup</h2>

                <div class="section-line"></div>

            </div>


            <form id="signupForm" novalidate>

                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username:
                    </label>

                    <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            onfocusout="validateUsername()">

                    <span
                            id="usernameError"
                            class="error-message">
                    </span>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email:
                    </label>

                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter email"
                            onfocusout="validateEmail()">

                    <span
                            id="emailError"
                            class="error-message">
                    </span>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password:
                    </label>

                    <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            onfocusout="validatePassword()">

                    <span
                            id="passwordError"
                            class="error-message">
                    </span>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password:
                    </label>

                    <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            onfocusout="validateConfirmPassword()">

                    <span
                            id="confirmPasswordError"
                            class="error-message">
                    </span>

                </div>


                <button
                        type="submit"
                        class="btn btn-primary btn-block">

                    Sign Up

                </button>

                <div
                        id="successMessage"
                        class="success-message">
                </div>

            </form>

        </div>

    </div>

</main>


<!-- Footer -->
<footer>

    <div class="container">

        <p>
            &copy; 2026 Aziz's Website | Created with Bootstrap
        </p>

    </div>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


<!-- Form Validation JavaScript -->
<script>

    // Show an error and make the textbox red
    function showError(input, errorBox, message) {

        input.style.borderColor = "red";
        input.style.color = "red";

        errorBox.innerHTML = message;
        errorBox.style.color = "red";
    }


    // Remove the red color when the value is correct
    function clearError(input, errorBox) {

        input.style.borderColor = "";
        input.style.color = "";

        errorBox.innerHTML = "";
    }


    // Validate username
    function validateUsername() {

        var username = document.getElementById("username");
        var error = document.getElementById("usernameError");

        if (username.value.trim() == "") {

            showError(
                username,
                error,
                "Username is required."
            );

            return false;
        }

        else {

            clearError(username, error);

            return true;
        }
    }


    // Validate email
    function validateEmail() {

        var email = document.getElementById("email");
        var error = document.getElementById("emailError");

        var emailFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email.value.trim() == "") {

            showError(
                email,
                error,
                "Email is required."
            );

            return false;
        }

        else if (!emailFormat.test(email.value.trim())) {

            showError(
                email,
                error,
                "Please enter a valid email address."
            );

            return false;
        }

        else {

            clearError(email, error);

            return true;
        }
    }


    // Validate password
    function validatePassword() {

        var password = document.getElementById("password");
        var error = document.getElementById("passwordError");

        if (password.value == "") {

            showError(
                password,
                error,
                "Password is required."
            );

            return false;
        }

        else {

            clearError(password, error);

            // Check confirm password again if something is already entered
            if (document.getElementById("confirmPassword").value != "") {

                validateConfirmPassword();
            }

            return true;
        }
    }


    // Validate confirm password
    function validateConfirmPassword() {

        var password = document.getElementById("password");

        var confirmPassword =
            document.getElementById("confirmPassword");

        var error =
            document.getElementById("confirmPasswordError");


        if (confirmPassword.value == "") {

            showError(
                confirmPassword,
                error,
                "Confirm Password is required."
            );

            return false;
        }

        else if (password.value != confirmPassword.value) {

            showError(
                confirmPassword,
                error,
                "Passwords do not match."
            );

            return false;
        }

        else {

            clearError(
                confirmPassword,
                error
            );

            return true;
        }
    }


    // Check every field when Sign Up is clicked
    document
        .getElementById("signupForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            var usernameValid = validateUsername();

            var emailValid = validateEmail();

            var passwordValid = validatePassword();

            var confirmPasswordValid =
                validateConfirmPassword();


            if (
                usernameValid &&
                emailValid &&
                passwordValid &&
                confirmPasswordValid
            ) {

                document.getElementById(
                    "successMessage"
                ).innerHTML =
                    "Signup information is valid.";

            }

            else {

                document.getElementById(
                    "successMessage"
                ).innerHTML = "";
            }

        });

</script>

</body>

</html>
